<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pagina</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <h1>Bienvenido a Mi Pagina</h1>
    <p>Esta es una simple pagina web.</p>
    <section>
        <h2>Sección de Contenido</h2>
        <p>Aquí puedes agregar más información sobre tu sitio web.</p>
        <article>
            <h3>Artículo 1</h3>
            <p>Este es el primer artículo de la sección.</p>
        </article>
        <article>
            <h3>Artículo 2</h3>
            <p>Este es el segundo artículo de la sección.</p>
        </article>
        <figure>
            <img src="imagen.jpg" alt="Descripción de la imagen">
            <figcaption>Esta es una imagen de ejemplo.</figcaption>
        </figure>
    </section>
</body>
</html>
