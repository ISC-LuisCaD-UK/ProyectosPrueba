<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h1 id="title">Survey Form</h1>
    <p id="description">Please fill out the form below:</p>
    <form id="survey-form">
        <label for="name" id="name-label">
            Name:
            <input type="text" id="name" name="name" required
            placeholder="Enter your name">
        </label>
        <br>
        <label for="email" id="email-label">
            Email:
            <input type="email" id="email" name="email" required
            placeholder="Enter your email">
        </label>
        <br>
        <label for="number" id="number-label">
            Age:
            <input type="number" id="number" name="age" min="1" max="120" 
            required
            placeholder="Enter your age">
        </label>
        <br>
        <label for="gender" id="gender-label">
            Gender:
            <select id="dropdown" name="gender" required>
                <option value="">Select</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </label>
        <br>
        <input type="radio" id="excellent" name="experience" value="excellent" required>
        <label for="excellent">Excellent</label>
        <input type="radio" id="good" name="experience" value="good">
        <label for="good">Good</label>
        <input type="radio" id="average" name="experience" value="average">
        <label for="average">Average</label>
        <input type="radio" name="experience" value="poor"> Poor
        <br>
        <input type="checkbox" name="programming-languages" value="javascript"> JavaScript
        <input type="checkbox" name="programming-languages" value="python"> Python
        <input type="checkbox" name="programming-languages" value="java"> Java
        <input type="checkbox" name="programming-languages" value="c++"> C++
        <input type="checkbox" name="programming-languages" value="other"> Other
        <br>
        <textarea name="comments" placeholder="Your comments here..."></textarea>
        <br>
        <button type="submit" id="submit">Submit</button>
    </form>
</body>
</html>
