<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="Cart Image" width="200">
    </section>

    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name">Name on Card:<span class="required" aria-hidden="true">*</span></label>
            <input type="text" id="card-name" name="card-name" required><br><br>

            <label for="card-number">Card Number:<span class="required" aria-hidden="true">*</span></label>
            <input type="text" id="card-number" name="card-number" aria-describedby="card-number-help" required>

            <p id="card-number-help" aria-describedby="card-number-help">Please enter a valid credit card number.</p><br><br>

            <label for="address">Address:<span class="required" aria-hidden="true">*</span></label>
            <input type="text" id="address" name="address" required><br><br>

            <label for="city">City:<span class="required" aria-hidden="true">*</span></label>
            <input type="text" id="city" name="city" required><br><br>

            <label for="state">State:<span class="required" aria-hidden="true">*</span></label>
            <input type="text" id="state" name="state" required><br><br>

            <label for="zip">ZIP Code:<span class="required" aria-hidden="true">*</span></label>
            <input type="text" id="zip" name="zip" required><br><br>

            <button type="submit">Submit</button>
        </form>
</body>
</html>
