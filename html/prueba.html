<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Prueba con Javascript</title>
</head>
<body>
	<script type="text/javascript">
		var nombre;
		nombre = prompt("Hola, Quien eres, Carlos o Lydia?","");
		if(nombre == "Carlos"){
			alert("Buenos dias Carlos. Hace rato te esperaba.");
		}
		else
			{
				if (nombre == "Lydia") {
					alert("Buenos dias Lydia. Que tal tus vacaciones?");
				}
				else
				{
					alert("No te conozco, pero de todas formas, buenos dias.");
					}
			}
	</script>
</body>
</html>
